# A NodePort Service in front of the Deployment above, so the rollout can be
# watched from a browser while it happens.
apiVersion: v1
kind: Service
metadata:
  name: web-deploy-service
  labels:
    app: web-deploy
spec:
  type: NodePort
  selector:
    app: web-deploy
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30001
