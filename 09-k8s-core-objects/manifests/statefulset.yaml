# A StatefulSet gives each Pod a stable ordinal name (web-0, web-1, web-2),
# stable DNS through its governing headless Service, and — with
# volumeClaimTemplates — its own PersistentVolumeClaim that survives rescheduling.
# Pods are created in order and deleted in reverse order.
apiVersion: v1
kind: Service
metadata:
  name: web-headless
  labels:
    app: web-sts
spec:
  clusterIP: None           # headless: no VIP, DNS returns the Pod IPs
  selector:
    app: web-sts
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-sts
spec:
  serviceName: web-headless
  replicas: 3
  selector:
    matchLabels:
      app: web-sts
  template:
    metadata:
      labels:
        app: web-sts
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 64Mi
