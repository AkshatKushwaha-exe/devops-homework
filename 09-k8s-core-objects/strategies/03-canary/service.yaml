# One Service in front of both tracks. The selector deliberately does NOT include
# `track`, so every stable and canary Pod is an endpoint.
apiVersion: v1
kind: Service
metadata:
  name: myapp-canary-service
  labels:
    app: myapp-canary
spec:
  type: NodePort
  selector:
    app: myapp-canary        # note: no `track` key here
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30030
