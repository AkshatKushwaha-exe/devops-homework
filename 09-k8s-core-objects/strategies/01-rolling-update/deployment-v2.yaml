# The v2 side of the rolling update: same Deployment name, new image tag and new
# page. Applying it creates a second ReplicaSet; Kubernetes then adds one v2 Pod,
# waits for it to pass its readiness probe, removes one v1 Pod, and repeats.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-rolling
  labels:
    app: app-rolling
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app-rolling
  template:
    metadata:
      labels:
        app: app-rolling
        version: v2
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /usr/share/nginx/html/index.html <<'HTML'
              <html><body style="background:#0f3460;color:#00ffcc;font-family:monospace;font-size:3em;text-align:center;padding-top:20vh">
              <p>VERSION: v2</p>
              <p style="font-size:0.5em;color:#8ab4f8">Rolling update demo — NEW VERSION</p>
              </body></html>
              HTML
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
