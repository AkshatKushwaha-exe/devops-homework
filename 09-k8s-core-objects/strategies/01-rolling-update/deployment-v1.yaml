# RollingUpdate with maxSurge: 1 / maxUnavailable: 0 — capacity never drops below
# the desired 4, so the Service keeps answering throughout the update.
#
# The page is written by the container command rather than a postStart hook, so
# there is no window where nginx serves the stock welcome page instead of the
# version banner. postStart has no ordering guarantee against the entrypoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-rolling
  labels:
    app: app-rolling
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app-rolling
  template:
    metadata:
      labels:
        app: app-rolling
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /usr/share/nginx/html/index.html <<'HTML'
              <html><body style="background:#1a1a2e;color:#e94560;font-family:monospace;font-size:3em;text-align:center;padding-top:20vh">
              <p>VERSION: v1</p>
              <p style="font-size:0.5em;color:#8ab4f8">Rolling update demo</p>
              </body></html>
              HTML
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
