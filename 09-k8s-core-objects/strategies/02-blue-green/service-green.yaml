# The switch. This is the only file that decides who is live: the selector.
# Traffic goes to whichever slot this selector names.
apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  labels:
    app: myapp
spec:
  type: NodePort
  selector:
    app: myapp
    slot: green         # <-- live environment
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30020
