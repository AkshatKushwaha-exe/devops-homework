# Recreate: every old Pod is terminated before any new Pod is created.
# That is a deliberate outage window, and the point of the exercise is to measure it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-recreate
  labels:
    app: app-recreate
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app-recreate
  template:
    metadata:
      labels:
        app: app-recreate
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /usr/share/nginx/html/index.html <<'HTML'
              <html><body style="background:#1b262c;color:#bbe1fa;font-family:monospace;font-size:3em;text-align:center;padding-top:20vh">
              <p>STRATEGY: RECREATE</p>
              <p style="font-size:0.6em;color:#3282b8">VERSION: v1</p>
              </body></html>
              HTML
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
