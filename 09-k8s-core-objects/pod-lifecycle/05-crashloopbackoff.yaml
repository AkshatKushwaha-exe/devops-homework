# CrashLoopBackOff. Not a phase — it is a container *waiting reason*.
# The container exits 1, the default restartPolicy: Always restarts it, it exits
# again, and the kubelet backs off exponentially (10s, 20s, 40s ... capped at 5m).
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-crashloop
spec:
  containers:
    - name: crasher
      image: busybox:1.36
      command: ["sh", "-c", "echo 'starting up'; sleep 3; echo 'crashing'; exit 1"]
