# Phase: Failed. Container exits non-zero and restartPolicy is Never,
# so Kubernetes leaves it dead. `kubectl get pods` shows STATUS=Error.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-failed
spec:
  restartPolicy: Never
  containers:
    - name: broken-job
      image: busybox:1.36
      command: ["sh", "-c", "echo 'about to fail'; exit 1"]
