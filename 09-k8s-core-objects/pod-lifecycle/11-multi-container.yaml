# Multi-container Pod: an app container and a sidecar sharing one emptyDir volume
# and one network namespace. READY shows 2/2. The sidecar writes to the file the
# web server serves, and reaches the app over localhost.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-multi-container
spec:
  volumes:
    - name: shared
      emptyDir: {}
  containers:
    - name: app
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared
          mountPath: /usr/share/nginx/html
    - name: sidecar
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            echo "<h1>Updated by the sidecar at $(date -u +%H:%M:%S)</h1>" > /work/index.html
            sleep 10
          done
      volumeMounts:
        - name: shared
          mountPath: /work
