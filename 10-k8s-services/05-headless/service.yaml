# Headless: clusterIP: None. No virtual IP and no kube-proxy rules — a DNS query
# for the Service name returns the A records of every ready Pod instead of one VIP.
#
# Paired with a StatefulSet it also gives each Pod its own stable DNS name:
#   db-0.db-headless.default.svc.cluster.local
# which is how clustered databases find their peers.
apiVersion: v1
kind: Service
metadata:
  name: db-headless
  labels:
    app: db-headless
spec:
  clusterIP: None
  selector:
    app: db-headless
  ports:
    - name: http
      port: 80
      targetPort: 80
