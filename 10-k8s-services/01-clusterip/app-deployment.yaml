# Three nginx Pods. Each serves a page naming its own Pod, so a repeated request
# through the Service shows the load balancing rather than just "it worked".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-clusterip
  labels:
    app: web-clusterip
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-clusterip
  template:
    metadata:
      labels:
        app: web-clusterip
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "ClusterIP demo - served by ${POD_NAME} on ${POD_IP}" \
                > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
