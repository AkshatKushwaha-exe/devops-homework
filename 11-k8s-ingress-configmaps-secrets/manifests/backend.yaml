# Backend: a small Python HTTP server that prints the configuration it was given,
# which is what makes the injection visible in a browser.
#
# envFrom + configMapRef  -> pulls every key from the ConfigMap in one line
# env + secretKeyRef      -> pulls named keys from the Secret, one at a time
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-backend
  namespace: default
  labels:
    app: demo-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-backend
  template:
    metadata:
      labels:
        app: demo-backend
    spec:
      containers:
        - name: backend
          image: python:3.11-slim
          command: ["python3", "-c"]
          args:
            - |
              import os
              from http.server import HTTPServer, BaseHTTPRequestHandler

              class Handler(BaseHTTPRequestHandler):
                  def log_message(self, *args):
                      pass

                  def do_GET(self):
                      body = (
                          "Demo Backend API\n"
                          "================\n"
                          f"POD             : {os.getenv('HOSTNAME', '?')}\n"
                          f"ENVIRONMENT     : {os.getenv('ENVIRONMENT', 'unset')}\n"
                          f"LOG_LEVEL       : {os.getenv('LOG_LEVEL', 'unset')}\n"
                          f"DEFAULT_CURRENCY: {os.getenv('DEFAULT_CURRENCY', 'unset')}\n"
                          f"POSTGRES_USER   : {os.getenv('POSTGRES_USER', 'unset')}\n"
                          f"POSTGRES_DB     : {os.getenv('POSTGRES_DB', 'unset')}\n"
                          "POSTGRES_PASSWORD: (in the environment, not printed)\n"
                      ).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

              HTTPServer(("0.0.0.0", 5000), Handler).serve_forever()
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: db-secret, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-secret, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: db-secret, key: POSTGRES_DB }
          readinessProbe:
            httpGet: { path: /, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "192Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-backend-service
  namespace: default
  labels:
    app: demo-backend
spec:
  type: ClusterIP
  selector:
    app: demo-backend
  ports:
    - name: http
      port: 80
      targetPort: 5000
