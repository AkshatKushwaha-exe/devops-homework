# A Secret holds the same shape of data, base64-encoded rather than encrypted.
# Anyone who can read the Secret can decode it in one command — RBAC, not the
# encoding, is what protects it. (Encryption at rest is a separate cluster setting.)
#
# Values were produced with `echo -n`. Without -n, echo appends a newline and the
# decoded password is one byte longer than the real one, which fails
# authentication in a way that is genuinely hard to see.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: default
  labels:
    app: demo-app
type: Opaque
data:
  # echo -n "app_admin"        | base64
  POSTGRES_USER: YXBwX2FkbWlu
  # echo -n "s3cretpassword"   | base64
  POSTGRES_PASSWORD: czNjcmV0cGFzc3dvcmQ=
  # echo -n "app_production_db" | base64
  POSTGRES_DB: YXBwX3Byb2R1Y3Rpb25fZGI=
